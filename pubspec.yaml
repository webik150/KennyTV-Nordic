name: kenny_tv
description: "An Android TV app to stream South Park episodes directly from their servers."

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.0.2+3

minSdkVersion: "21"
targetSdkVersion: "30"

environment:
    sdk: ">=3.8.0 <4.0.0"

dependencies:
    dio: ^5.11.1
    dio_http2_adapter: ^2.9.0
    flutter:
        sdk: flutter
    flutter_localizations:
        sdk: flutter
    flutter_riverpod: ^3.4.3
    freezed_annotation: ^3.1.0
    go_router: ^18.0.2
    html: ^0.15.7
    http: ^1.6.0
    json_annotation: ^4.12.0
    path: ^1.9.1
    path_provider: ^2.1.6
    riverpod_annotation: ^4.0.7
    sembast: ^3.8.11
    video_player: ^2.14.0
    pro_video_player:
        git:
            url: https://github.com/vitormf/pro_video_player.git
            path: pro_video_player
            ref: main # branch name

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0
    build_runner: ^2.16.1
    #custom_lint: ^0.8.1
    riverpod_generator: ^4.0.9
    riverpod_lint: ^3.1.9
    freezed: ^4.0.2
    json_serializable: ^6.14.1

flutter:
    uses-material-design: true

    # Enable generation of localized Strings from arb files.
    generate: true

    assets:
        # Add assets from the images directory to the application.
        - assets/images/
        - assets/ca/
